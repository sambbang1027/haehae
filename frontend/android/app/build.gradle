apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// (android/app/build.gradle)
apply from: project(':react-native-config').projectDir.getPath() + "/dotenv.gradle"


react {

    /* Autolinking */
    autolinkLibrariesWithApp()
}

def enableProguardInReleaseBuilds = false

def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.haehae"
    defaultConfig {
        applicationId "com.haehae"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "1.0"
        // 빌드 속도 높이기 (x86, x86_64 아키텍처 생략)
        // ndk {
        //     abiFilters "armeabi-v7a", "arm64-v8a"
        // }
        ndk {
        abiFilters "armeabi-v7a", "arm64-v8a", "x86", "x86_64"
    }

    // 소셜 로그인
        manifestPlaceholders = [
            KAKAO_NATIVE_APP_KEY: "cbfb5e59932949a2501348c64cabe5e8" ,
            googleSigninWebClientId: "1032730359503-m2aidsmm9s09ch6g9qq4a9iko7q0p5t7.apps.googleusercontent.com"
        ]

    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        // release key 
        release{
            // storeFile rootProject.file(MYAPP_RELEASE_STORE_FILE)
            // storePassword MYAPP_RELEASE_STORE_PASSWORD
            // keyAlias MYAPP_RELEASE_KEY_ALIAS
            // keyPassword MYAPP_RELEASE_KEY_PASSWORD
        storeFile file(MYAPP_RELEASE_STORE_FILE)
        storePassword MYAPP_RELEASE_STORE_PASSWORD
        keyAlias MYAPP_RELEASE_KEY_ALIAS
        keyPassword MYAPP_RELEASE_KEY_PASSWORD
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            debuggable true
        } 
        release {
            // 기존 잠시 비활성화
            // signingConfig signingConfigs.debug
            // minifyEnabled enableProguardInReleaseBuilds
            // proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"
            // release- key
            shrinkResources false
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }

    implementation project(':react-native-gesture-handler')
    implementation platform('com.google.firebase:firebase-bom:32.2.3') // Firebase BOM (버전 관리)
    // implementation 'com.google.firebase:firebase-analytics' // 예시로 Analytics SDK 추가

    implementation project(':react-native-encrypted-storage')
}

apply plugin: 'com.google.gms.google-services'

tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
    kotlinOptions {
        jvmTarget = "17"
    }
}

